id: ACKRO_AWS_S3_001
title: S3 Bucket public access block should block public ACLs
description: S3 Bucket resources should set publicAccessBlock.blockPublicACLs to true.
severity: HIGH
category: NETWORK_EXPOSURE
resource:
  provider: aws
  service: s3
  type: Bucket
match:
  apiGroups:
    - s3.services.k8s.aws
  kinds:
    - Bucket
assertions:
  - path: spec.publicAccessBlock.blockPublicACLs
    operator: is_true
    message: spec.publicAccessBlock.blockPublicACLs is missing or not true
remediation:
  message: Set spec.publicAccessBlock.blockPublicACLs to true.
  patch:
    spec:
      publicAccessBlock:
        blockPublicACLs: true
references:
  - type: aws_security_hub
    id: S3.1
  - type: aws_config
    id: s3-bucket-level-public-access-prohibited
compatibility:
  status: stable
  introducedIn: 0.1.0
notes: >-
  The ACK s3-controller models the public access block inline on the Bucket
  CRD under spec.publicAccessBlock; there is no separate
  BucketPublicAccessBlock CRD in ACK. A missing block fails the control.
---
