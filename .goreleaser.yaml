version: 2

project_name: ackrocheck

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ackrocheck
    main: ./cmd/ackrocheck
    binary: ackrocheck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/edgarsilva948/ackrocheck/internal/version.Version={{ .Version }}
      - -X github.com/edgarsilva948/ackrocheck/internal/version.Commit={{ .Commit }}
      - -X github.com/edgarsilva948/ackrocheck/internal/version.Date={{ .Date }}
      - -X github.com/edgarsilva948/ackrocheck/internal/version.ControlsVersion=embedded-{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
